<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyGivBox</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: white;
      padding: 20px 15px 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .subtitle {
      color: #777;
      margin-top: 5px;
      font-size: 14px;
    }

    #search {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 12px;
    }

    .category {
      border: 0;
      padding: 9px 14px;
      border-radius: 20px;
      background: #eee;
      white-space: nowrap;
    }

    .category.active {
      background: #222;
      color: white;
    }

    main {
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .badge {
      display: inline-block;
      background: #eee;
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 9px;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .date {
      color: #666;
      font-size: 13px;
      margin-bottom: 13px;
    }

    .source {
      color: #999;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .participate {
      display: inline-block;
      background: #222;
      color: white;
      text-decoration: none;
      padding: 11px 15px;
      border-radius: 10px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 40px 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>🎁 MyGivBox</h1>
  <div class="subtitle">Деньги • Техника • Игры • Крипто</div>

  <input
    id="search"
    type="search"
    placeholder="🔎 Найти розыгрыш..."
  >

  <div class="categories">
    <button class="category active" data-category="all">Все</button>
    <button class="category" data-category="money">💰 Деньги</button>
    <button class="category" data-category="tech">📱 Техника</button>
    <button class="category" data-category="games">🎮 Игры</button>
    <button class="category" data-category="crypto">💎 Крипто</button>
  </div>
</header>

<main>
  <div id="list" class="empty">
    Загружаем розыгрыши… 🎁
  </div>
</main>

<script>
  let giveaways = [];
  let currentCategory = "all";

  const list = document.getElementById("list");
  const search = document.getElementById("search");

  const categoryNames = {
    money: "💰 Деньги",
    tech: "📱 Техника",
    games: "🎮 Игры",
    crypto: "💎 Крипто"
  };

  function formatDate(date) {
    if (!date) return "Дата окончания не указана";

    const d = new Date(date);

    if (isNaN(d.getTime())) {
      return "Дата окончания не указана";
    }

    return "⏰ До " + d.toLocaleDateString("ru-RU");
  }

  function render() {
    const query = search.value.toLowerCase().trim();

    const filtered = giveaways.filter(item => {
      const title = String(item.title || "").toLowerCase();

      const categoryOk =
        currentCategory === "all" ||
        item.category === currentCategory;

      const searchOk =
        !query || title.includes(query);

      return categoryOk && searchOk;
    });

    if (!filtered.length) {
      list.innerHTML = `
        <div class="empty">
          😔 Подходящих розыгрышей пока нет
        </div>
      `;
      return;
    }

    list.innerHTML = filtered.map(item => {
      const category = categoryNames[item.category] || "🎁 Розыгрыш";

      return `
        <div class="card">
          <div class="badge">${category}</div>

          <h2>${escapeHtml(item.title || "Розыгрыш")}</h2>

          <div class="date">
            ${formatDate(item.end_date)}
          </div>

          <div class="source">
            Источник: ${escapeHtml(item.source || "Публичный источник")}
          </div>

          <a
            class="participate"
            href="${escapeAttr(item.url || "#")}"
            target="_blank"
          >
            Участвовать
          </a>
        </div>
      `;
    }).join("");
  }

  function escapeHtml(text) {
    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function escapeAttr(text) {
    return String(text)
      .replaceAll('"', "&quot;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  fetch("giveaways.json?time=" + Date.now())
    .then(response => {
      if (!response.ok) {
        throw new Error("Ошибка загрузки");
      }
      return response.json();
    })
    .then(data => {
      giveaways = Array.isArray(data) ? data : [];

      // Ближайшие даты окончания — сверху
      giveaways.sort((a, b) => {
        const dateA = a.end_date
          ? new Date(a.end_date).getTime()
          : Infinity;

        const dateB = b.end_date
          ? new Date(b.end_date).getTime()
          : Infinity;

        return dateA - dateB;
      });

      render();
    })
    .catch(error => {
      console.error(error);

      list.innerHTML = `
        <div class="empty">
          ⚠️ Не удалось загрузить розыгрыши
        </div>
      `;
    });

  search.addEventListener("input", render);

  document.querySelectorAll(".category").forEach(button => {
    button.addEventListener("click", () => {
      document
        .querySelectorAll(".category")
        .forEach(b => b.classList.remove("active"));

      button.classList.add("active");
      currentCategory = button.dataset.category;

      render();
    });
  });
</script>

</body>
</html>
