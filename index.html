<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyGivBox</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      padding: 22px 16px 14px;
      background: white;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .subtitle {
      margin-top: 5px;
      color: #777;
      font-size: 14px;
    }

    #search {
      width: 100%;
      margin-top: 15px;
      padding: 13px 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 12px;
    }

    .category {
      border: 0;
      padding: 9px 14px;
      border-radius: 20px;
      background: #eee;
      white-space: nowrap;
      cursor: pointer;
    }

    .category.active {
      background: #222;
      color: white;
    }

    main {
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .source {
      color: #777;
      font-size: 13px;
      margin-bottom: 12px;
      word-break: break-all;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    .participate,
    .done {
      border: 0;
      border-radius: 10px;
      padding: 11px 13px;
      cursor: pointer;
      font-size: 14px;
    }

    .participate {
      background: #222;
      color: white;
      text-decoration: none;
    }

    .done {
      background: #eee;
    }

    .done.active {
      background: #dff5e5;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
      color: #777;
    }

    .loading {
      text-align: center;
      padding: 40px 10px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h1>🎁 MyGivBox</h1>
  <div class="subtitle">Каталог Telegram-розыгрышей</div>

  <input
    id="search"
    type="search"
    placeholder="🔎 Найти розыгрыш..."
  >

  <div class="categories">
    <button class="category active" data-category="all">Все</button>
    <button class="category" data-category="stars">⭐ Stars</button>
    <button class="category" data-category="premium">💎 Premium</button>
    <button class="category" data-category="money">💰 Деньги</button>
    <button class="category" data-category="tech">📱 Техника</button>
  </div>
</header>

<main>
  <div id="list" class="loading">
    Загружаем розыгрыши… 🎁
  </div>
</main>

<script>
  let giveaways = [];
  let currentCategory = "all";

  const list = document.getElementById("list");
  const search = document.getElementById("search");

  function detectCategory(text) {
    const value = text.toLowerCase();

    if (
      value.includes("star") ||
      value.includes("звезд") ||
      value.includes("stars")
    ) {
      return "stars";
    }

    if (
      value.includes("premium") ||
      value.includes("премиум")
    ) {
      return "premium";
    }

    if (
      value.includes("руб") ||
      value.includes("₽") ||
      value.includes("деньг") ||
      value.includes("cash")
    ) {
      return "money";
    }

    if (
      value.includes("iphone") ||
      value.includes("айфон") ||
      value.includes("телефон") ||
      value.includes("техник")
    ) {
      return "tech";
    }

    return "all";
  }

  function render() {
    const query = search.value.toLowerCase().trim();

    const filtered = giveaways.filter(item => {
      const text = (item.title || "").toLowerCase();
      const category = detectCategory(text);

      const categoryOk =
        currentCategory === "all" ||
        category === currentCategory;

      const searchOk =
        !query ||
        text.includes(query);

      return categoryOk && searchOk;
    });

    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty">
          😔 Розыгрышей не найдено
        </div>
      `;
      return;
    }

    list.innerHTML = filtered.map((item, index) => `
      <div class="card">
        <h2>🎁 ${escapeHtml(item.title || "Розыгрыш")}</h2>

        <div class="source">
          ${escapeHtml(item.url || "")}
        </div>

        <div class="buttons">
          <a
            class="participate"
            href="${escapeAttr(item.url || "#")}"
            target="_blank"
          >
            Участвовать
          </a>

          <button
            class="done"
            onclick="markDone(${index})"
          >
            ✓ Я участвовал
          </button>
        </div>
      </div>
    `).join("");
  }

  function markDone(index) {
    const buttons = document.querySelectorAll(".done");
    if (buttons[index]) {
      buttons[index].classList.toggle("active");
      buttons[index].textContent =
        buttons[index].classList.contains("active")
          ? "✓ Участвовал"
          : "✓ Я участвовал";
    }
  }

  function escapeHtml(text) {
    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function escapeAttr(text) {
    return String(text)
      .replaceAll('"', "&quot;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  fetch("giveaways.json?time=" + Date.now())
    .then(response => {
      if (!response.ok) {
        throw new Error("Не удалось загрузить giveaways.json");
      }

      return response.json();
    })
    .then(data => {
      giveaways = Array.isArray(data) ? data : [];
      render();
    })
    .catch(error => {
      console.error(error);

      list.innerHTML = `
        <div class="empty">
          ⚠️ Не удалось загрузить розыгрыши.<br><br>
          Попробуйте открыть приложение немного позже.
        </div>
      `;
    });

  search.addEventListener("input", render);

  document.querySelectorAll(".category").forEach(button => {
    button.addEventListener("click", () => {
      document
        .querySelectorAll(".category")
        .forEach(item => item.classList.remove("active"));

      button.classList.add("active");
      currentCategory = button.dataset.category;

      render();
    });
  });
</script>

</body>
</html>
