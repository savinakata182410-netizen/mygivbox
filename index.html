<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>MyGivBox — Розыгрыши</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f7;
    color: #171717;
}

header {
    padding: 20px 16px 10px;
    text-align: center;
}

.logo {
    font-size: 28px;
    font-weight: 800;
}

.subtitle {
    margin-top: 5px;
    color: #777;
    font-size: 14px;
}

.categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 14px;
    scrollbar-width: none;
}

.categories::-webkit-scrollbar {
    display: none;
}

.category {
    flex: 0 0 auto;
    border: 0;
    background: white;
    border-radius: 20px;
    padding: 9px 14px;
    font-size: 14px;
    cursor: pointer;
}

.category.active {
    background: #111;
    color: white;
}

#status {
    padding: 5px 16px 12px;
    color: #777;
    font-size: 13px;
}

#list {
    padding: 0 12px 30px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

.card-category {
    font-size: 13px;
    color: #777;
    margin-bottom: 7px;
}

.card-title {
    font-size: 17px;
    line-height: 1.35;
    font-weight: 700;
    margin-bottom: 12px;
}

.card-info {
    font-size: 13px;
    color: #666;
    margin-bottom: 5px;
}

.end {
    font-weight: 700;
    color: #d35400;
}

.button {
    display: block;
    width: 100%;
    margin-top: 13px;
    padding: 12px;
    border-radius: 12px;
    background: #111;
    color: white;
    text-align: center;
    text-decoration: none;
    font-weight: 700;
}

.empty {
    text-align: center;
    padding: 50px 20px;
    color: #777;
}

.loading {
    text-align: center;
    padding: 40px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <div class="logo">🎁 MyGivBox</div>
    <div class="subtitle">Актуальные розыгрыши по России</div>
</header>

<div class="categories">

    <button class="category active" data-category="all">
        Все
    </button>

    <button class="category" data-category="money">
        💰 Деньги
    </button>

    <button class="category" data-category="tech">
        📱 Техника
    </button>

    <button class="category" data-category="cosmetics">
        💄 Косметика
    </button>

    <button class="category" data-category="clothes">
        👗 Одежда
    </button>

    <button class="category" data-category="home">
        🏠 Дом
    </button>

    <button class="category" data-category="games">
        🎮 Игры
    </button>

    <button class="category" data-category="auto">
        🚗 Авто
    </button>

    <button class="category" data-category="food">
        🍔 Еда
    </button>

    <button class="category" data-category="certificates">
        🎟️ Сертификаты
    </button>

    <button class="category" data-category="crypto">
        🪙 Crypto
    </button>

    <button class="category" data-category="other">
        🎁 Другое
    </button>

</div>

<div id="status">
    Загружаем розыгрыши...
</div>

<div id="list">
    <div class="loading">
        ⏳ Загрузка...
    </div>
</div>
